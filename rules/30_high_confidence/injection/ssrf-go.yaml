# SSRF (Server-Side Request Forgery) in Go — HTTP request URL derived from
# handler input flowing into a real HTTP-client call. Rewritten 2026-09-23
# after a validation pass showed the earlier version FP'd on generic
# `Header.Get(...)` sources and `url.Parse(...)` sinks (a parser, not a
# request-maker). This version requires:
#   * source = a handler input accessor that clearly identifies user data
#   * sink   = an actual HTTP client method (Get/Head/Post/NewRequest/Do)
# and no longer flags url.Parse or generic header/tag reads.
rules:
  - id: ssrf-tainted-url-go
    languages: [go]
    severity: ERROR
    mode: taint
    message: |
      Go HTTP request URL derived from user input allows Server-Side Request
      Forgery (SSRF). Attackers can pivot to internal services, hit
      cloud-metadata endpoints (`169.254.169.254` on AWS/GCP/Azure → IAM
      credentials → account takeover), or abuse the app as an open proxy.

      Fix: (1) validate the URL against an allowlist of host/domain,
      (2) resolve DNS and reject private/link-local/loopback IPs,
      (3) restrict scheme to http(s), (4) disable redirect following or
      re-validate after each redirect (see `http.Client.CheckRedirect`).
    metadata:
      cwe: 'CWE-918: Server-Side Request Forgery'
      owasp: 'A10:2021 Server-Side Request Forgery'
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
    pattern-sources:
      # net/http stdlib — only the query/form/path accessors, not header reads
      # (raw header reads are used for many non-URL purposes like content-type,
      # correlation IDs, etc. and cause FPs when kept as taint sources).
      - pattern: $REQ.URL.Query().Get($K)
      - pattern: $REQ.FormValue($K)
      - pattern: $REQ.PostFormValue($K)
      - pattern: $REQ.PathValue($K)
      # Gin — only accessors that carry user data. GetHeader dropped for the
      # same reason as stdlib Header.Get above.
      - pattern: $CTX.Query($K)
      - pattern: $CTX.DefaultQuery($K, ...)
      - pattern: $CTX.Param($K)
      - pattern: $CTX.PostForm($K)
      - pattern: $CTX.DefaultPostForm($K, ...)
      # Echo
      - pattern: $CTX.QueryParam($K)
      - pattern: $CTX.FormValue($K)
      # Beego — only Input.Query, not Tag.Get() which the earlier pattern
      # accidentally matched via metavariable overlap.
      - pattern: $CTX.Ctx.Input.Query($K)
      - pattern: $CTX.Ctx.Input.Param($K)
      # Fiber
      - pattern: $CTX.Params($K)
      # chi / gorilla mux
      - pattern: mux.Vars($REQ)[$K]
      - pattern: chi.URLParam($REQ, $K)
    pattern-sinks:
      # Only true HTTP-client entry points. url.Parse is intentionally
      # excluded — it's a parser, not a request-sender. Similarly url.URL
      # struct construction alone is not a sink.
      - pattern-either:
          - pattern: http.Get($X)
          - pattern: http.Head($X)
          - pattern: http.Post($X, ...)
          - pattern: http.PostForm($X, ...)
          - pattern: http.NewRequest($M, $X, ...)
          - pattern: http.NewRequestWithContext($C, $M, $X, ...)
          # Client wrappers
          - pattern: $CLIENT.Get($X)
          - pattern: $CLIENT.Head($X)
          - pattern: $CLIENT.Post($X, ...)
          - pattern: $CLIENT.PostForm($X, ...)
          # Popular HTTP libraries — resty / go-resty
          - pattern: resty.New().R().Get($X)
          - pattern: $R.Get($X)
          - pattern: $R.SetBaseURL($X)
    pattern-sanitizers:
      # Team-authored URL validation is respected — treat these as sanitizers
      # so validated URLs don't produce findings.
      - pattern: $VALIDATOR.ValidateURL($X)
      - pattern: $VALIDATOR.IsAllowedHost($X)
      - pattern: url.ParseRequestURI($X)  # more strict than url.Parse
