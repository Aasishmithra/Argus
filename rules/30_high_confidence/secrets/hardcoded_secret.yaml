rules:
  - id: hardcoded-secret
    severity: ERROR
    message: "Hardcoded credential/API key found. Consider using a secure vault or environment variables."
    languages: [javascript, typescript, python, php, ruby, swift, go, java, kotlin]
    patterns:
      - pattern: $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(api[_-]?key|secret|token|passwd|password)
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?-i)(["'])((?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[-_.])[A-Za-z0-9_.\-]{20,})\1
    paths:
      exclude:
        - "*test*"
        - "*_test.*"
        - "*/tests/*"
        - "*.example.*"
        - "*/examples/*"
    metadata:
      cwe: "CWE-798"
      confidence: HIGH