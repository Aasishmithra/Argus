rules:
  - id: default-password-in-code
    severity: ERROR
    message: Default or weak password present in code/config.
    languages: [javascript, typescript, python, php, ruby, go, yaml, java, kotlin]
    pattern-either:
      - pattern-regex: (?i)password\s*[:=]\s*['"]?(admin|password|passw0rd|123456|12345678|qwerty)['"]?
      - pattern-regex: (?i)default_password\s*[:=]\s*['"][^'"]+['"]
    metadata:
      cwe: "CWE-259"
      confidence: HIGH
