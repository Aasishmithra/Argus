rules:
  - id: weak-jwt-secret
    severity: ERROR
    message: Weak/short JWT secret used.
    languages: [javascript, typescript, python, php, ruby, java, kotlin]
    pattern-either:
      - pattern-regex: (?i)jwt\.(sign|verify)\(.*['"][a-z0-9]{1,15}['"]
      - pattern-regex: (?i)secret(?:_key)?\s*[:=]\s*['"][a-z0-9]{1,15}['"]
    metadata:
      cwe: "CWE-326"
      confidence: HIGH
