rules:
  - id: aws-secret-exposed
    severity: ERROR
    message: AWS access key/secret key exposed in code/config.
    languages: [javascript, typescript, python, php, ruby, go, yaml, java, kotlin]
    pattern-either:
      - pattern-regex: AKIA[0-9A-Z]{16}
      - pattern-regex: (?i)aws(_|-)secret(_|-)access(_|-)key\s*[:=]\s*['"][A-Za-z0-9/+=]{35,}['"]
    metadata:
      cwe: "CWE-798"
      confidence: HIGH
