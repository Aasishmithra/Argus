rules:
  - id: aws-hardcoded-credentials
    message: |
      AWS credentials detected (accessKeyId or secretAccessKey). Avoid hardcoding sensitive information.
      Use environment variables or a secrets manager (e.g., AWS Secrets Manager, HashiCorp Vault).
      Rotate any exposed credentials immediately.
    severity: WARNING
    metadata:
      likelihood: HIGH
      impact: CRITICAL
      confidence: HIGH
      category: security
      subcategory:
        - hardcoded-secrets
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - A07:2021 - Identification and Authentication Failures
      references:
        - https://docs.aws.amazon.com/general/latest/gr/aws-access-keys-best-practices.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_CheatSheet.html
    languages:
      - js
      - ts
      - python
      - java
      - go
      - yaml
      - json
      - bash
      - php
      - ruby
      - c
      - cpp      # instead of "c++"
      - kotlin
      - swift
      - terraform
      - hcl
      - dockerfile
      - html
      - xml

    #mode: taint

    # Patterns for detecting AWS accessKeyId and secretAccessKey
    patterns:
      # Match AWS accessKeyId (starts with AKIA or ASIA)
      - pattern-regex: |
          (?i)(AWS_ACCESS_KEY_ID|accessKeyId)\s*[:=]\s*['"]?(AKIA|ASIA)[A-Z0-9]{16}['"]?

      # Match AWS secretAccessKey (40-character Base64-like string)
      - pattern-regex: |
          (?i)(AWS_SECRET_ACCESS_KEY|secretAccessKey)\s*[:=]\s*['"]?[A-Za-z0-9/+=]{40}['"]?

      # Match environment variable declarations
      - pattern-regex: |
          (?i)(export\s+)?(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)\s*=\s*['"]?[A-Za-z0-9/+=]{20,40}['"]?

      # Match JSON/YAML-style key-value pairs
      - pattern-regex: |
          (?i)["']?(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|accessKeyId|secretAccessKey)["']?\s*[:=]\s*['"]?[A-Za-z0-9/+=]{20,40}['"]?

      # Detect split strings or concatenated keys (multi-line support)
      - pattern-regex: |
          (?i)(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|accessKeyId|secretAccessKey)\s*[:=]\s*["']?[A-Za-z0-9+/]{10,}["']?\s*[\+\|]?\s*["']?[A-Za-z0-9+/]{10,}["']?

      # Detect keys in comments or logs
      - pattern-regex: |
          (?i)(//|#|<!--)\s*(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|accessKeyId|secretAccessKey)\s*[:=]\s*['"]?(AKIA|ASIA)?[A-Za-z0-9/+=]{16,40}['"]?

    # Files to scan
    path-regex: |
      \.(env|yaml|yml|json|properties|ini|js|ts|py|java|go|php|rb|c|cpp|swift|kotlin|tf|hcl|dockerfile|txt|md|sh|log|csv|tsv|xml|html)$

    # Include entropy analysis for high-entropy strings
    metavariable-analysis:
      analyzer: entropy
      metavariable: $AWS_KEY
      threshold: "4.5"
